# The dashboard's single configuration file.
#
# Copy this file to data/config.toml in the working directory and fill it in.
# The SQLite database is created beside it (data/team.sqlite).
#
# Required keys are validated at startup: a missing or invalid value stops the
# app with an explicit error. There are no environment variables and no CLI
# flags.

team_id = 1                 # osu! team id (positive integer); the team's
                            # identity, logo, roster and default game mode
                            # come from the API

client_id = 1               # osu! OAuth application client id — from
                            # https://osu.ppy.sh/home/account/edit#oauth
client_secret = "replace-me"  # osu! OAuth application client secret — keep
                              # this file out of version control
refresh_token = "replace-me"  # your stored osu! refresh token — the collector
                              # renews it and writes the rotated token back
                              # into this file; a rejected token exits

rate_divider = 2            # optional; request budget = 60 / rate_divider
                            # per minute (default 2)

# The score-feed base interval is a fixed rule: 5 seconds × rate_divider.
# The web backend listens on port 3000. Both are not configurable.
